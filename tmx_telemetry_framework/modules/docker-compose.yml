# Use lightweight Python 3.11 image
FROM python:3.11-slim

# Set working directory inside the container
WORKDIR /app

# Install system dependencies (required for scientific computing packages if needed)
RUN apt-get update && apt-get install -y --no-install-recommends \
    build-essential \
    && rm -rf /var/lib/apt/lists/*

# Copy requirements file and install Python dependencies
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

# Copy the entire simulation framework source code into the container
COPY . /app

# Set environment variables for headless Matplotlib rendering
ENV MPLBACKEND=Agg

# Define default command to execute the simulation & telemetry pipeline
CMD ["python", "qatar_library_mqtt_streamer.py"]
version: '3.8'

services:
  # MQTT Broker for real-time SCADA telemetry streaming
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: qil-mqtt-broker
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - qil-net

  # Qatar Islamic Library Simulation & Telemetry Pipeline
  qil-simulation:
    build: .
    container_name: qil-simulation-engine
    depends_on:
      - mqtt-broker
    environment:
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
    volumes:
      - ./output_artifacts:/app/output
    networks:
      - qil-net
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:

networks:
  qil-net:
    driver: bridge
groups:
  - name: qatar_islamic_library_vault_alerts
    rules:
      - alert: HVACPressureLoss
        expr: mqtt_payload_pressure_differential_pa < 10.0
        for: 1m
        labels:
          severity: critical
          system: hvac
          facility: qatar-islamic-library
        annotations:
          summary: "Critical HVAC pressure loss detected"
          description: "Subterranean archive zone pressure differential has dropped below 10.0 Pa (current value: {{ $value }} Pa). Positive pressurization failure risks particulate and dust infiltration."

      - alert: HumidityThresholdBreach
        expr: mqtt_payload_humidity_pct < 45.0 or mqtt_payload_humidity_pct > 55.0
        for: 2m
        labels:
          severity: warning
          system: environment
          facility: qatar-islamic-library
        annotations:
          summary: "Environmental humidity threshold breach"
          description: "Subterranean relative humidity has drifted outside the optimal preservation window of 50% +/- 5% (current value: {{ $value }}%). Immediate HVAC regulation adjustment required."
